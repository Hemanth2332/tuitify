[project]
name = "tuitify"
version = "0.1.0"
description = "Terminal music player for YouTube"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-vlc>=3.0.21203",
    "requests>=2.33.1",
    "sentence-transformers>=5.6.1",
    "textual>=8.2.4",
    "textual-image>=0.12.0",
    "yt-dlp>=2026.3.17",
]

[project.scripts]
tuitify = "tuitify.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tuitify"]

[tool.hatch.build.targets.sdist]
exclude = [".agents"]
